[template]
ignore = ["LICENSE", "README.md", ".jj"]

[placeholders]
features = { prompt = "Which bevy features would you like?", choices = [
  "2D",
  "3D",
  "UI",
  "Audio",
], type = "array" }
crates = { prompt = "Which utility crates would you like?", choices = [
  "avian",
  "enhanced_input",
  # seedling isn't updated for 0.20 yet :[
  # "seedling",
  "inspector_egui"
], type = "array" }
nearest_filter = { prompt = "Would you like to use the 'nearest' filter? (for pixel art)", type = "bool" }
web = { prompt = "Would you like to export your game to the web?", type = "bool", default = true }
justfile = { prompt = "Would you like a justfile?", type = "bool", default = true }

[conditional."justfile".placeholders]
itch = { prompt = "Would you like to publish to itch.io?", type = "bool", default = false }

[conditional."!justfile"]
ignore = ["justfile"]

[conditional."itch".placeholders]
itch-page = { prompt = "What's your itch.io page? (user/game)", default = "PLACEHOLDER" }
